    panel('Datos para los formatos', '<form class="form-ajustes">' + formHTML(CAMPOS_AJUSTES, a) +
      '<div class="logo-campo"><div class="logo-prev">' + (a.logo ? '<img src="' + a.logo + '" alt="Escudo">' : '<span>Sin escudo</span>') + '</div><div><b>Escudo de la institución</b><p class="nota">Opcional. Solo aparece si eliges «Mostrar los datos de la institución».</p>' +
      '<label class="btn sec chico">' + ic('subir') + '<span>Subir imagen</span><input type="file" accept="image/*" name="logoArchivo" hidden></label> ' + (a.logo ? boton('quitarLogo', 'Quitar', 'borrar', 'sec chico') : '') + '</div></div>' +
      '<div class="form-acc">' + boton('guardar', 'Guardar', 'check') + boton('muestra', 'Ver un formato de muestra', 'formatos', 'sec') + '</div></form>') +
    '</div><div class="col">' +
    panel('Copia de seguridad', '<p>Todo lo que registras se guarda <b>solo en este navegador y en este equipo</b>. No se envía a internet. Si borras el historial del navegador o cambias de equipo, lo pierdes, salvo que tengas una copia.</p>' +
      datosDL([['Registros guardados', String(total)], ['Última copia', a.ultimoRespaldo ? fLarga(a.ultimoRespaldo) : 'Nunca']]) +
      '<div class="form-acc">' + boton('exportar', 'Descargar copia', 'descargar') + '<label class="btn sec">' + ic('subir') + '<span>Restaurar una copia</span><input type="file" accept=".json,application/json" name="respaldoArchivo" hidden></label></div>' +
      '<p class="nota">Para usar la aplicación en otro equipo: descarga la copia aquí y restáurala allá. La copia incluye las fotos.</p>') +
    panel('Confidencialidad', '<ul class="lista-simple"><li><b>Usa un equipo personal con contraseña.</b><small>La información de los casos es reservada (Ley 1098 de 2006, Ley 1581 de 2012 y Ley 1090 de 2006).</small></li>' +
      '<li><b>Guarda las copias en un lugar protegido.</b><small>El archivo de respaldo contiene los datos de los estudiantes sin cifrar.</small></li>' +
      '<li><b>Los documentos impresos van al archivo de orientación.</b><small>No los dejes en carpetas compartidas ni en el correo institucional abierto.</small></li></ul>') +
    panel('Borrar todo', '<p>Elimina de este navegador todos los estudiantes, casos, registros y fotos. Descarga antes una copia.</p>' + boton('borrarTodo', 'Borrar toda la información', 'borrar', 'peligro'), '', 'panel-alerta') +
    '</div></div>';
  const form = $('.form-ajustes', el);
  form.onsubmit = e => e.preventDefault();
  el.addEventListener('change', async e => {
    if (e.target.name === 'logoArchivo' && e.target.files[0]) {
      try { a.logo = await comprimir(e.target.files[0], 300, 0.85); guardar(); aviso('Escudo guardado.'); refrescar(); } catch (err) { aviso('No se pudo leer la imagen.', 'error'); }
    }
    if (e.target.name === 'respaldoArchivo' && e.target.files[0]) {
      const archivo = e.target.files[0]; e.target.value = '';
      if (!(await confirmar('Restaurar la copia reemplaza toda la información actual de este navegador. ¿Continuar?', 'Restaurar'))) return;
      try { await importarRespaldo(await archivo.text()); pintarMenu(); aviso('Copia restaurada.'); location.hash = '#/inicio'; }
      catch (err) { aviso(err.message.includes('respaldo') ? err.message : 'El archivo no se pudo leer como copia de seguridad.', 'error'); }
    }
  });
  enlazar(el, {
    guardar: () => { Object.assign(a, leerForm(form, CAMPOS_AJUSTES)); guardar(); pintarMenu(); aviso('Ajustes guardados.'); },
    muestra: () => { Object.assign(a, leerForm(form, CAMPOS_AJUSTES)); guardar(); abrirFormato('f-citacion'); },
    quitarLogo: () => { a.logo = ''; guardar(); refrescar(); },
    exportar: async () => { await exportarRespaldo(); aviso('Copia descargada.'); refrescar(); },
    borrarTodo: async () => {
      if (!(await confirmar('Se borrará toda la información de este navegador. Esta acción no se puede deshacer.', 'Borrar todo'))) return;
      COLECCIONES.forEach(k => { DB[k] = []; }); DB.cronoHecho = {};
      await Fotos.vaciar(); guardar(); aviso('Información borrada.'); location.hash = '#/inicio';
    }
  });
};

// ── Arranque
cargar();
pintarMenu();
$('#abrir-menu').onclick = () => document.body.classList.add('menu-abierto');
$('#velo').onclick = () => document.body.classList.remove('menu-abierto');
window.addEventListener('hashchange', () => navegar(false));
navegar(false);

</script>
</body>
</html>
