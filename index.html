<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orientación APP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>/* Orientación APP */
:root {
  --papel: #f4f4f1; --superficie: #ffffff; --hundido: #ecece7; --linea: #dcdcd4; --linea-fuerte: #c4c4ba;
  --tinta: #1d2a2f; --tinta-2: #4a575c; --tinta-3: #78858a;
  --teal: #1f5f63; --teal-2: #174a4d; --teal-suave: #e3eeed; --sobre-teal: #ffffff;
  --n1: #9a6b12; --n1-suave: #f6eedc; --n2: #b4521a; --n2-suave: #f8e7dc; --n3: #a8302b; --n3-suave: #f6e1df;
  --ok: #2f6d3a; --ok-suave: #e2efe3;
  --sombra: 0 1px 2px rgba(29,42,47,.06), 0 4px 16px rgba(29,42,47,.05);
  --radio: 10px; --radio-chico: 7px;
  --f-tit: 'Newsreader', Georgia, serif; --f-txt: 'Public Sans', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #121718; --superficie: #1a2123; --hundido: #222a2c; --linea: #2d3739; --linea-fuerte: #3d494b;
    --tinta: #e6ebea; --tinta-2: #aeb9b9; --tinta-3: #7d8a8b;
    --teal: #6fb3b3; --teal-2: #8ccaca; --teal-suave: #1d3233; --sobre-teal: #0e1a1b;
    --n1: #e0b45a; --n1-suave: #2e2716; --n2: #ec955f; --n2-suave: #33231a; --n3: #f08a83; --n3-suave: #362020;
    --ok: #7cc58a; --ok-suave: #1b2e1f;
    --sombra: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #121718; --superficie: #1a2123; --hundido: #222a2c; --linea: #2d3739; --linea-fuerte: #3d494b;
  --tinta: #e6ebea; --tinta-2: #aeb9b9; --tinta-3: #7d8a8b;
  --teal: #6fb3b3; --teal-2: #8ccaca; --teal-suave: #1d3233; --sobre-teal: #0e1a1b;
  --n1: #e0b45a; --n1-suave: #2e2716; --n2: #ec955f; --n2-suave: #33231a; --n3: #f08a83; --n3-suave: #362020;
  --ok: #7cc58a; --ok-suave: #1b2e1f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--papel); color: var(--tinta); font: 15px/1.55 var(--f-txt); }
h1, h2, h3 { font-family: var(--f-tit); font-weight: 500; line-height: 1.2; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(1.7rem, 3.4vw, 2.3rem); }
h2 { font-size: 1.22rem; }
h3 { font-size: 1.05rem; }
p { margin: 0 0 .6em; }
a { color: var(--teal); }
small { color: var(--tinta-3); }
img { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.nota { color: var(--tinta-3); font-size: .86rem; }

/* ── Armazón */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.lateral { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--superficie); border-right: 1px solid var(--linea); padding: 22px 14px 30px; }
.marca { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--tinta); padding: 0 8px 18px; }
.marca .ic { width: 30px; height: 30px; color: var(--teal); stroke-width: 1.4; }
.marca b { display: block; font: 500 1.25rem/1.1 var(--f-tit); }
.marca small { display: block; font-size: .74rem; line-height: 1.3; max-width: 170px; }
#menu a { display: flex; align-items: center; gap: 11px; padding: 7px 10px; border-radius: var(--radio-chico); color: var(--tinta-2); text-decoration: none; font-size: .93rem; }
#menu a:hover { background: var(--hundido); color: var(--tinta); }
#menu a.activo { background: var(--teal-suave); color: var(--teal); font-weight: 600; }
.menu-grupo { margin: 18px 10px 5px; font-size: .7rem; letter-spacing: .09em; text-transform: uppercase; color: var(--tinta-3); }
.menu-grupo:empty { margin: 10px; border-top: 1px solid var(--linea); }
.principal { min-width: 0; }
.barra-movil { display: none; }
#velo { display: none; }
#vista { max-width: 1180px; margin: 0 auto; padding: 34px 40px 80px; }

@media (max-width: 900px) {
  .app { display: block; }
  .lateral { position: fixed; z-index: 40; inset: 0 auto 0 0; width: 280px; transform: translateX(-100%); transition: transform .22s ease; box-shadow: var(--sombra); }
  .menu-abierto .lateral { transform: none; }
  .menu-abierto #velo { display: block; position: fixed; inset: 0; z-index: 30; background: rgba(10,16,18,.45); }
  .barra-movil { display: flex; align-items: center; gap: 6px; position: sticky; top: 0; z-index: 20; background: var(--superficie); border-bottom: 1px solid var(--linea); padding: 8px 10px; }
  .barra-movil .marca { padding: 0; }
  .barra-movil .marca small { display: none; }
  #vista { padding: 22px 16px 70px; }
}

/* ── Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 16px; border: 1px solid var(--teal); border-radius: var(--radio-chico); background: var(--teal); color: var(--sobre-teal); font-weight: 600; font-size: .9rem; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--teal-2); border-color: var(--teal-2); }
.btn.sec { background: var(--superficie); color: var(--tinta); border-color: var(--linea-fuerte); }
.btn.sec:hover { background: var(--hundido); }
.btn.chico { min-height: 32px; padding: 5px 11px; font-size: .84rem; }
.btn.alerta { background: var(--n3); border-color: var(--n3); color: #fff; }
.btn.peligro { background: var(--superficie); color: var(--n3); border-color: var(--n3); }
.btn.peligro:hover { background: var(--n3-suave); }
.icono { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: var(--radio-chico); background: transparent; color: var(--tinta-2); cursor: pointer; flex: none; }
.icono:hover { background: var(--hundido); color: var(--tinta); }
.form-acc, .acciones, .barra-guardar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.form-acc { margin-top: 16px; }

/* ── Cabecera de página */
.pagina-cab { margin-bottom: 26px; }
.volver { display: inline-flex; align-items: center; gap: 4px; font-size: .86rem; text-decoration: none; color: var(--tinta-2); margin-bottom: 10px; }
.volver:hover { color: var(--teal); }
.pagina-fila { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.pagina-tit .sub { color: var(--tinta-2); margin: 6px 0 0; max-width: 64ch; }
.inicio-cab { margin-bottom: 22px; }
.fecha-hoy::first-letter, .cal-cab h2::first-letter, .dia-detalle .panel-cab h2::first-letter { text-transform: uppercase; }
.fecha-hoy { color: var(--tinta-3); font-size: .88rem; margin-bottom: 4px; }

/* ── Paneles y rejillas */
.panel { background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio); padding: 20px 22px; margin-bottom: 18px; }
.panel-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.panel-acc { display: flex; gap: 6px; flex-wrap: wrap; }
.panel-alerta { border-color: color-mix(in srgb, var(--n3) 35%, var(--linea)); }
.panel-alerta .panel-cab h2 { color: var(--n3); }
.rejilla-2, .rejilla-caso { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 18px; align-items: start; }
.rejilla-caso { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.rejilla-agenda { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 0 18px; align-items: start; }
@media (max-width: 1000px) { .rejilla-2, .rejilla-caso, .rejilla-agenda { grid-template-columns: minmax(0, 1fr); } }
.vacio { text-align: center; padding: 26px 12px; color: var(--tinta-3); border: 1px dashed var(--linea-fuerte); border-radius: var(--radio-chico); }
.vacio p { margin-bottom: 10px; }
.vacio p:last-child { margin: 0; }
.titulo-seccion { margin: 30px 0 14px; font-size: 1.35rem; }
dl.datos { display: grid; grid-template-columns: minmax(110px, auto) 1fr; gap: 7px 16px; margin: 0 0 6px; font-size: .92rem; }
dl.datos dt { color: var(--tinta-3); }
dl.datos dd { margin: 0; overflow-wrap: anywhere; }
dl.datos.chico { font-size: .84rem; gap: 4px 12px; }
.bloque { margin-bottom: 16px; }
.bloque h3 { font: 600 .74rem/1.4 var(--f-txt); letter-spacing: .07em; text-transform: uppercase; color: var(--tinta-3); margin-bottom: 4px; }
.bloque p:last-child { margin: 0; }
.lista-simple { list-style: none; margin: 0; padding: 0; }
.lista-simple li { padding: 9px 0; border-top: 1px solid var(--linea); }
.lista-simple li:first-child { border-top: 0; padding-top: 0; }
.lista-simple small { display: block; }

/* ── Bandas y avisos */
.banda { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: var(--radio); background: var(--teal-suave); margin-bottom: 16px; }
.banda > .ic { color: var(--teal); width: 22px; height: 22px; }
.banda p { margin: 0; flex: 1; }
.banda.alerta { background: var(--n1-suave); }
.banda.alerta > .ic { color: var(--n1); }
@media (max-width: 640px) { .banda { flex-wrap: wrap; } .banda p { flex-basis: calc(100% - 40px); } }
.aviso { position: fixed; z-index: 100; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; transition: .2s; background: var(--tinta); color: var(--papel); padding: 11px 18px; border-radius: var(--radio-chico); box-shadow: var(--sombra); font-size: .9rem; max-width: calc(100vw - 32px); }
.aviso.visible { opacity: 1; transform: translate(-50%, 0); }
.aviso.error { background: var(--n3); color: #fff; }

/* ── Inicio */
.accesos { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
.acceso { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 16px; background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio); text-decoration: none; color: var(--tinta); text-align: left; cursor: pointer; transition: border-color .15s, transform .15s; }
.acceso:hover { border-color: var(--teal); transform: translateY(-1px); }
.acceso .ic { width: 24px; height: 24px; color: var(--teal); margin-bottom: 8px; }
.acceso b { font-size: .93rem; }
.acceso small { font-size: .78rem; line-height: 1.35; }
.acceso.alerta .ic { color: var(--n3); }
.acceso.alerta:hover { border-color: var(--n3); }
@media (max-width: 1100px) { .accesos { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .accesos { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.cifras { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
@media (max-width: 760px) { .cifras { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.cifra { display: block; padding: 16px 18px; background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio); text-decoration: none; color: var(--tinta); }
.cifra b { display: block; font: 500 2rem/1 var(--f-tit); margin-bottom: 4px; }
.cifra span { font-size: .84rem; color: var(--tinta-2); }
.cifra.alerta b { color: var(--n3); }
a.cifra:hover { border-color: var(--teal); }
.lista-hoy, .lista-citas { list-style: none; margin: 0; padding: 0; }
.lista-hoy a, .lista-citas a { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--linea); text-decoration: none; color: var(--tinta); }
.lista-hoy li:first-child a, .lista-citas li:first-child a { border-top: 0; }
.lista-hoy a > .ic { color: var(--teal); }
.lista-hoy .cita a > .ic { color: var(--n2); }
.lista-hoy span, .lista-citas a > span:nth-child(2) { flex: 1; min-width: 0; }
.lista-hoy small, .lista-citas small { display: block; }
.lista-hoy .hecha b { text-decoration: line-through; color: var(--tinta-3); }
.lista-citas a > .ic { color: var(--tinta-3); }
.fecha-mini { display: grid; place-items: center; width: 46px; padding: 4px 0; border-radius: var(--radio-chico); background: var(--teal-suave); color: var(--teal); font-size: .7rem; text-transform: uppercase; line-height: 1.1; flex: none; }
.fecha-mini b { font: 500 1.25rem/1 var(--f-tit); }

/* ── Chips, estados y niveles */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--linea-fuerte); border-radius: 99px; font-size: .84rem; cursor: pointer; background: var(--superficie); color: var(--tinta-2); text-decoration: none; }
.chip input { accent-color: var(--teal); margin: 0; }
.chip:has(input:checked), .chip.activo { background: var(--teal-suave); border-color: var(--teal); color: var(--teal); }
.chip.sugerida { border-style: dashed; border-color: var(--n2); }
.chips.estaticos .chip { cursor: default; }
.estado, .modalidad, .etq { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: .74rem; font-weight: 600; white-space: nowrap; }
.estado { background: var(--hundido); color: var(--tinta-2); }
.est-abierto { background: var(--teal-suave); color: var(--teal); }
.est-seguimiento { background: var(--n1-suave); color: var(--n1); }
.est-remitido, .est-activada { background: var(--n2-suave); color: var(--n2); }
.est-cerrado { background: var(--hundido); color: var(--tinta-3); }
.modalidad { background: var(--teal-suave); color: var(--teal); }
.modalidad.nivel-1 { background: var(--n1-suave); color: var(--n1); }
.modalidad.nivel-2 { background: var(--n2-suave); color: var(--n2); }
.modalidad.nivel-3 { background: var(--n3-suave); color: var(--n3); }
.etq.nueva { background: var(--ok-suave); color: var(--ok); }
.etq.verificar { background: var(--n1-suave); color: var(--n1); }

/* ── Casos */
.pestanas { display: flex; gap: 4px; border-bottom: 1px solid var(--linea); margin-bottom: 18px; }
.pestanas a { padding: 9px 14px; text-decoration: none; color: var(--tinta-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.pestanas a.activa { color: var(--teal); border-color: var(--teal); font-weight: 600; }
.pestanas small { margin-left: 4px; }
.filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.filtros select, .filtros input[type="date"] { min-height: 40px; padding: 7px 10px; border: 1px solid var(--linea-fuerte); border-radius: var(--radio-chico); background: var(--superficie); }
.buscar { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; padding: 0 12px; min-height: 40px; border: 1px solid var(--linea-fuerte); border-radius: var(--radio-chico); background: var(--superficie); color: var(--tinta-3); }
.buscar input { flex: 1; border: 0; outline: 0; background: transparent; padding: 8px 0; min-width: 0; color: var(--tinta); }
.buscar:focus-within { border-color: var(--teal); }
.contador, .resumen { font-size: .84rem; color: var(--tinta-3); }
.lista-casos { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
.panel .lista-casos { grid-template-columns: minmax(0, 1fr); }
.tarjeta-caso { display: block; padding: 14px 16px 14px 18px; background: var(--superficie); border: 1px solid var(--linea); border-left: 4px solid var(--teal); border-radius: var(--radio-chico); text-decoration: none; color: var(--tinta); }
.tarjeta-caso:hover { box-shadow: var(--sombra); }
.tarjeta-caso.nivel-1 { border-left-color: var(--n1); }
.tarjeta-caso.nivel-2 { border-left-color: var(--n2); }
.tarjeta-caso.nivel-3 { border-left-color: var(--n3); }
.tc-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.tc-tipo { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: .86rem; color: var(--tinta-2); min-width: 0; }
.tc-tipo span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tc-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .8rem; color: var(--tinta-3); }
.tc-meta .ic { width: 14px; height: 14px; }
.prox { color: var(--teal); }
.pend { color: var(--n2); font-weight: 600; }
.tabla-resp { overflow-x: auto; }
.tabla { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tabla th { text-align: left; font-weight: 600; font-size: .76rem; letter-spacing: .05em; text-transform: uppercase; color: var(--tinta-3); padding: 8px 10px; border-bottom: 1px solid var(--linea-fuerte); }
.tabla td { padding: 10px; border-bottom: 1px solid var(--linea); vertical-align: top; }
.tabla tr[data-href] { cursor: pointer; }
.tabla tr[data-href]:hover td { background: var(--hundido); }
.est-nombre { font: 500 1.2rem/1.3 var(--f-tit); }
.est-nombre a { color: var(--tinta); text-decoration: none; }

/* Nuevo caso */
.modalidades { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 700px) { .modalidades { grid-template-columns: 1fr; } }
.modalidad-card { display: block; padding: 26px; background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio); text-decoration: none; color: var(--tinta); transition: border-color .15s, box-shadow .15s; }
.modalidad-card:hover { border-color: var(--teal); box-shadow: var(--sombra); }
.modalidad-card.ruta:hover { border-color: var(--n3); }
.modalidad-card h2 { margin: 14px 0 6px; font-size: 1.4rem; }
.modalidad-card p, .modalidad-card li { color: var(--tinta-2); font-size: .92rem; }
.mc-ic { display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 12px; background: var(--teal-suave); color: var(--teal); }
.mc-ic .ic { width: 26px; height: 26px; }
.modalidad-card.ruta .mc-ic { background: var(--n3-suave); color: var(--n3); }
.modalidad-card ul { padding-left: 18px; margin: 10px 0 16px; }
.mc-ir { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; color: var(--teal); }
.modalidad-card.ruta .mc-ir { color: var(--n3); }
.segmento { display: inline-flex; padding: 3px; border-radius: var(--radio-chico); background: var(--hundido); margin-bottom: 14px; }
.segmento label { position: relative; }
.segmento input { position: absolute; opacity: 0; }
.segmento span { display: block; padding: 6px 14px; border-radius: 5px; cursor: pointer; font-size: .88rem; color: var(--tinta-2); }
.segmento input:checked + span { background: var(--superficie); color: var(--tinta); font-weight: 600; box-shadow: var(--sombra); }
.barra-guardar { position: sticky; bottom: 0; z-index: 5; justify-content: flex-end; padding: 14px 0; margin-top: 8px; background: linear-gradient(transparent, var(--papel) 30%); }
.guia-ruta { padding: 14px 16px; border-radius: var(--radio-chico); background: var(--hundido); border-left: 4px solid var(--teal); margin-bottom: 14px; font-size: .9rem; }
.guia-ruta.nivel-1 { border-left-color: var(--n1); background: var(--n1-suave); }
.guia-ruta.nivel-2 { border-left-color: var(--n2); background: var(--n2-suave); }
.guia-ruta.nivel-3 { border-left-color: var(--n3); background: var(--n3-suave); }
.guia-ruta ol, .guia-ruta ul { margin: 0 0 8px; padding-left: 20px; }
.gr-tit { font-weight: 700; font-size: .74rem; letter-spacing: .07em; text-transform: uppercase; margin: 10px 0 4px; }

/* Expediente del caso */
.linea-tiempo { list-style: none; margin: 0; padding: 0; }
.linea-tiempo li { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 14px; padding: 14px 0; border-top: 1px solid var(--linea); }
.linea-tiempo li:first-child { border-top: 0; padding-top: 0; }
.lt-fecha b { display: block; font-size: .9rem; }
.lt-fecha span { font-size: .78rem; color: var(--tinta-3); }
.lt-cuerpo p:last-child { margin-bottom: 0; }
.lt-acuerdos, .lt-prox { font-size: .86rem; padding: 6px 10px; border-radius: var(--radio-chico); background: var(--hundido); margin-top: 6px; }
.lt-prox { background: var(--teal-suave); color: var(--teal); display: inline-block; }
.lt-acc { display: flex; }
@media (max-width: 600px) { .linea-tiempo li { grid-template-columns: minmax(0, 1fr) auto; } .lt-fecha { grid-column: 1 / -1; } }
.lista-inst { list-style: none; margin: 0; padding: 0; }
.lista-inst li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--linea); }
.lista-inst li:first-child { border-top: 0; }
.lista-inst li > div:first-child { flex: 1; min-width: 0; }
.lista-inst small { display: block; }
.nivel-inst { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: .76rem; font-weight: 600; background: var(--hundido); color: var(--tinta-2); }
.nivel-inst.n0 { background: var(--ok-suave); color: var(--ok); }
.nivel-inst.n1 { background: var(--n1-suave); color: var(--n1); }
.nivel-inst.n2 { background: var(--n2-suave); color: var(--n2); }
.nivel-inst.n3 { background: var(--n3-suave); color: var(--n3); }
.alerta-inst { color: var(--n3); font-weight: 600; font-size: .86rem; }
.entidades { display: grid; gap: 8px; }
.entidad { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--linea); border-left: 4px solid var(--n2); border-radius: var(--radio-chico); }
.entidad.est-enviada { border-left-color: var(--n1); }
.entidad.est-respondida { border-left-color: var(--ok); }
.ent-nom { flex: 1 1 180px; min-width: 0; }
.ent-nom small { display: block; }
.ent-campos { display: flex; gap: 6px; flex-wrap: wrap; }
.ent-campos select, .ent-campos input { min-height: 34px; padding: 4px 8px; border: 1px solid var(--linea-fuerte); border-radius: var(--radio-chico); background: var(--superficie); font-size: .84rem; }
.ent-acc { display: flex; gap: 4px; align-items: center; }
.zona-entidades .chips { margin-bottom: 10px; }
.protocolo { list-style: none; margin: 0; padding: 0; }
.protocolo li { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-top: 1px solid var(--linea); font-size: .9rem; }
.protocolo li:first-child { border-top: 0; }
.protocolo label { flex: 1; display: flex; gap: 10px; cursor: pointer; min-width: 0; }
.protocolo label b { display: block; }
.protocolo li.hecho label span { color: var(--tinta-3); }
.protocolo input[type="checkbox"] { width: 18px; height: 18px; flex: none; accent-color: var(--teal); margin-top: 2px; }
.protocolo input[type="date"] { flex: none; min-height: 34px; padding: 4px 8px; border: 1px solid var(--linea-fuerte); border-radius: var(--radio-chico); background: var(--superficie); font-size: .82rem; }
@media (max-width: 560px) { .protocolo li { flex-wrap: wrap; } .protocolo input[type="date"] { margin-left: 28px; } }

/* Menú de documentos */
.menu-docs { display: grid; gap: 6px; }
.doc-opcion { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: 1px solid var(--linea); border-radius: var(--radio-chico); background: var(--superficie); text-align: left; cursor: pointer; font-size: .9rem; }
.doc-opcion > .ic:first-child { color: var(--teal); }
.doc-opcion span { flex: 1; }
.doc-opcion > .ic:last-child { color: var(--tinta-3); }
.doc-opcion:hover { border-color: var(--teal); background: var(--teal-suave); }

/* ── Formularios */
.campos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
@media (max-width: 640px) { .campos { grid-template-columns: minmax(0, 1fr); } }
.full { grid-column: 1 / -1; }
.campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; border: 0; padding: 0; margin: 0; }
.campo > span, .campo legend { font-size: .84rem; font-weight: 600; color: var(--tinta-2); padding: 0; margin-bottom: 5px; }
.campo > span { margin: 0; }
.campo small { font-size: .78rem; }
.req { color: var(--n3); }
.campo input, .campo select, .campo textarea { width: 100%; min-height: 40px; padding: 8px 11px; border: 1px solid var(--linea-fuerte); border-radius: var(--radio-chico); background: var(--superficie); }
.campo textarea { resize: vertical; line-height: 1.5; }
.campo input:focus, .campo select:focus, .campo textarea:focus { outline: 0; border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-suave); }
.campo-check { display: flex; align-items: center; gap: 9px; font-size: .92rem; cursor: pointer; }
.campo-check input { width: 18px; height: 18px; accent-color: var(--teal); }
.seccion-form { margin: 14px 0 0; padding-top: 14px; border-top: 1px solid var(--linea); font-size: 1.05rem; }
.campos > .seccion-form:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.filtros.rango .campo { flex-direction: row; align-items: center; gap: 8px; }
.filtros.rango .campo input { width: auto; }
.atajos { display: flex; flex-wrap: wrap; gap: 6px; }

/* Fotos */
.fotos-grupo { margin-bottom: 14px; }
.fotos-cab { display: flex; gap: 8px; align-items: baseline; margin-bottom: 8px; font-size: .88rem; }
.fotos-cab span { color: var(--tinta-3); }
.fotos-rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.miniatura { position: relative; margin: 0; aspect-ratio: 1; border-radius: var(--radio-chico); overflow: hidden; background: var(--hundido); }
.miniatura img { width: 100%; height: 100%; object-fit: cover; }
.quitar { position: absolute; top: 4px; right: 4px; display: grid; place-items: center; width: 26px; height: 26px; border: 0; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; }
.quitar .ic { width: 14px; height: 14px; }
.subir-foto { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; aspect-ratio: 1; border: 1.5px dashed var(--linea-fuerte); border-radius: var(--radio-chico); color: var(--tinta-3); font-size: .8rem; cursor: pointer; }
.subir-foto:hover { border-color: var(--teal); color: var(--teal); }
.galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.galeria a { display: block; aspect-ratio: 4 / 3; border-radius: var(--radio-chico); overflow: hidden; background: var(--hundido); }
.galeria img { width: 100%; height: 100%; object-fit: cover; }
.foto-grande { display: block; max-height: 72vh; margin: 0 auto; border-radius: var(--radio-chico); }
.logo-campo { display: flex; gap: 16px; align-items: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--linea); }
.logo-prev { display: grid; place-items: center; width: 84px; height: 84px; flex: none; border: 1px dashed var(--linea-fuerte); border-radius: var(--radio-chico); font-size: .74rem; color: var(--tinta-3); text-align: center; overflow: hidden; }
.logo-prev img { max-width: 100%; max-height: 100%; object-fit: contain; }

/* ── Modales */
.modal { width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 24px); padding: 0; border: 0; border-radius: 14px; background: var(--superficie); color: var(--tinta); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal.ancho { width: min(820px, calc(100vw - 24px)); }
.modal.chico { width: min(420px, calc(100vw - 24px)); }
.modal::backdrop, .visor::backdrop { background: rgba(10,16,18,.5); }
.modal-caja { display: flex; flex-direction: column; max-height: calc(100vh - 24px); margin: 0; }
.modal-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--linea); }
.modal-cuerpo { padding: 20px; overflow-y: auto; }
.modal-pie { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--linea); background: var(--hundido); }
.confirmar-txt { font-size: 1rem; margin: 0; }
@media (max-width: 640px) {
  .modal, .modal.ancho, .modal.chico { width: 100vw; max-width: 100vw; max-height: 100vh; height: 100%; margin: 0; border-radius: 0; }
  .modal-caja { max-height: 100vh; height: 100%; }
  .modal-cuerpo { flex: 1; }
}

/* ── Visor de documentos */
.visor { width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh; margin: 0; padding: 0; border: 0; background: var(--hundido); display: flex; flex-direction: column; }
.visor:not([open]) { display: none; }
.visor-barra { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--superficie); border-bottom: 1px solid var(--linea); flex-wrap: wrap; }
.visor-tit { flex: 1; min-width: 180px; }
.visor-tit b, .visor-tit small { display: block; }
.visor-acc { display: flex; gap: 8px; flex-wrap: wrap; }
.visor-hoja { flex: 1; overflow: auto; padding: 24px 16px; }
.visor-hoja iframe { display: block; width: min(850px, 100%); min-height: 1100px; margin: 0 auto; border: 0; background: #fff; box-shadow: 0 2px 20px rgba(0,0,0,.15); }
.cargando { text-align: center; color: var(--tinta-3); padding: 60px 0; }
@media (max-width: 640px) { .visor-acc .btn span { display: none; } .visor-tit small { display: none; } .visor-hoja { padding: 10px 0; } }

/* ── Registros: actas, cartas, PIAR */
.lista-reg { list-style: none; margin: 0; padding: 0; background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio); }
.fila-reg { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-top: 1px solid var(--linea); }
.fila-reg:first-child { border-top: 0; }
.fr-ic { display: grid; place-items: center; width: 38px; height: 38px; flex: none; border-radius: 9px; background: var(--teal-suave); color: var(--teal); }
.fr-txt { flex: 1; min-width: 0; }
.fr-txt a { color: var(--tinta); text-decoration: none; }
.fr-txt a:hover b { color: var(--teal); }
.fr-txt small { display: block; }
.fr-acc { display: flex; gap: 2px; flex: none; }
@media (max-width: 560px) { .fila-reg { flex-wrap: wrap; } .fr-acc { margin-left: 52px; } }
.lista-asist { columns: 2 220px; margin: 0; padding-left: 22px; font-size: .9rem; }

/* Bitácora */
.rejilla-bitacora { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.tarjeta-bit { display: block; background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio); overflow: hidden; text-decoration: none; color: var(--tinta); }
.tarjeta-bit:hover { box-shadow: var(--sombra); }
.tb-foto { position: relative; display: grid; place-items: center; aspect-ratio: 16 / 10; background: var(--hundido); color: var(--tinta-3); }
.tb-foto img { width: 100%; height: 100%; object-fit: cover; }
.tb-foto .ic { width: 30px; height: 30px; }
.tb-foto span { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 4px; align-items: center; padding: 2px 8px; border-radius: 99px; background: rgba(0,0,0,.6); color: #fff; font-size: .76rem; }
.tb-foto span .ic { width: 14px; height: 14px; }
.tb-txt { padding: 12px 14px 14px; }
.tb-txt small, .tb-txt b, .tb-txt span { display: block; }
.tb-txt b { font: 500 1.05rem/1.3 var(--f-tit); margin: 2px 0; }
.tb-txt span { font-size: .84rem; color: var(--tinta-2); }

/* Agenda */
.cal-cab { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }

.cal-sem, .cal-dias { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-sem span { text-align: center; font-size: .74rem; color: var(--tinta-3); font-weight: 600; padding-bottom: 4px; }
.dia { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; min-height: 58px; padding: 6px 2px; border: 1px solid transparent; border-radius: var(--radio-chico); background: var(--hundido); cursor: pointer; }
.dia.vacio { background: transparent; cursor: default; padding: 0; border: 0; text-align: initial; }
.dia b { font-weight: 500; font-size: .9rem; }
.dia:hover { border-color: var(--linea-fuerte); }
.dia.hoy b { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--teal); color: var(--sobre-teal); }
.dia.sel { border-color: var(--teal); background: var(--teal-suave); }
.puntos { display: flex; gap: 3px; }
.puntos i, .cal-ley i { display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px; font: 600 .66rem/1 var(--f-txt); font-style: normal; color: #fff; }
.p-tarea { background: var(--teal); }
.p-tarea.ok { background: var(--ok); }
.p-cita { background: var(--n2); }
.cal-ley { margin: 12px 0 0; font-size: .8rem; color: var(--tinta-3); }
.cal-ley i { min-width: 10px; height: 10px; padding: 0; vertical-align: -1px; }

.tareas, .citas { list-style: none; margin: 0; padding: 0; }
.tareas li, .citas li { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-top: 1px solid var(--linea); }
.tareas li:first-child, .citas li:first-child { border-top: 0; }
.citas { margin-bottom: 10px; }
.citas a { text-decoration: none; color: var(--tinta); }
.check-tarea input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--teal); cursor: pointer; }
.t-txt { flex: 1; min-width: 0; }
.t-txt b, .t-txt small { display: block; }
.t-txt time { color: var(--teal); }
.t-txt p { margin: 4px 0 0; font-size: .88rem; color: var(--tinta-2); }
.tareas .hecha .t-txt b { text-decoration: line-through; color: var(--tinta-3); }
.t-fotos { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; font-size: .78rem; color: var(--tinta-3); }
.t-fotos .ic { width: 14px; height: 14px; }

/* ── Consulta: rutas */
.componentes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 8px; }
@media (max-width: 900px) { .componentes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.componentes > * { padding: 16px; background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio); }
.num { font: 500 1.6rem/1 var(--f-tit); color: var(--teal); display: block; margin-bottom: 6px; }
.rejilla-rutas { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.tarjeta-ruta { display: flex; flex-direction: column; padding: 16px 18px; background: var(--superficie); border: 1px solid var(--linea); border-top: 4px solid var(--teal); border-radius: var(--radio); text-decoration: none; color: var(--tinta); }
.tarjeta-ruta:hover { box-shadow: var(--sombra); }
.tarjeta-ruta.nivel-1 { border-top-color: var(--n1); }
.tarjeta-ruta.nivel-2 { border-top-color: var(--n2); }
.tarjeta-ruta.nivel-3 { border-top-color: var(--n3); }
.tarjeta-ruta b { font: 500 1.12rem/1.3 var(--f-tit); margin: 4px 0 6px; }
.tarjeta-ruta p { font-size: .86rem; color: var(--tinta-2); flex: 1; }
.tr-etq { font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-3); }
.tr-pie { font-size: .8rem; color: var(--tinta-3); }
.directorio { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px 18px; }
.directorio li { padding: 8px 0; border-top: 1px solid var(--linea); font-size: .9rem; }
.dir-num { display: block; font: 500 1.2rem/1.2 var(--f-tit); color: var(--teal); }
.destacado { padding: 14px 16px; border-radius: var(--radio-chico); background: var(--teal-suave); margin-bottom: 14px; }
.pasos-ruta { list-style: none; counter-reset: paso; margin: 0; padding: 0; }
.pasos-ruta li { counter-increment: paso; position: relative; padding: 0 0 16px 44px; }
.pasos-ruta li::before { content: counter(paso); position: absolute; left: 0; top: 0; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--teal); color: var(--sobre-teal); font-weight: 700; font-size: .84rem; }
.pasos-ruta li::after { content: ''; position: absolute; left: 14px; top: 32px; bottom: 2px; width: 2px; background: var(--linea); }
.pasos-ruta li:last-child::after { display: none; }
.no-hacer { margin: 0; padding-left: 20px; }
.no-hacer li { margin-bottom: 4px; }

/* Normativa */
.normas { display: grid; gap: 8px; }
.norma { background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio-chico); }
.norma summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; padding: 13px 16px; cursor: pointer; list-style: none; }
.norma summary::-webkit-details-marker { display: none; }
.norma summary b { font-family: var(--f-tit); font-weight: 500; font-size: 1.05rem; }
.norma[open] summary { border-bottom: 1px solid var(--linea); }
.norma:target { border-color: var(--teal); }
.norma-cuerpo { padding: 14px 16px; font-size: .92rem; }
.norma-cuerpo ul { padding-left: 20px; margin: 0 0 8px; }

/* Formatos e instrumentos */
.rejilla-formatos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-bottom: 18px; }
.tarjeta-formato { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 16px; border: 1px solid var(--linea); border-radius: var(--radio); background: var(--superficie); text-align: left; cursor: pointer; }
.tarjeta-formato > .ic { color: var(--teal); width: 22px; height: 22px; margin-bottom: 6px; }
.tarjeta-formato small { flex: 1; font-size: .82rem; }
.tarjeta-formato:hover { border-color: var(--teal); }
.tf-acc { display: inline-flex; gap: 6px; align-items: center; margin-top: 8px; font-size: .82rem; font-weight: 600; color: var(--teal); }
.rejilla-inst { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.tarjeta-inst { display: flex; flex-direction: column; padding: 18px; background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio); }
.tarjeta-inst h3 { margin: 4px 0 10px; }
.ti-nom { font-size: .74rem; font-weight: 700; letter-spacing: .06em; color: var(--teal); }
.ti-acc { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 12px; }
.info-inst { display: flex; gap: 16px; font-size: .84rem; color: var(--tinta-3); margin-bottom: 8px; }
.info-inst span { display: inline-flex; gap: 5px; align-items: center; }
.consigna { padding: 12px 14px; background: var(--hundido); border-radius: var(--radio-chico); font-size: .92rem; }
.items-inst { margin: 0; padding-left: 22px; }
.items-inst li { padding: 10px 0; border-bottom: 1px solid var(--linea); }
.items-inst li p { margin-bottom: 6px; }
.escala { display: flex; flex-wrap: wrap; gap: 6px; }
.escala label { position: relative; }
.escala input { position: absolute; opacity: 0; }
.escala span { display: block; padding: 5px 11px; border: 1px solid var(--linea-fuerte); border-radius: 99px; font-size: .82rem; cursor: pointer; }
.escala input:checked + span { background: var(--teal); border-color: var(--teal); color: var(--sobre-teal); }
.escala input:focus-visible + span { outline: 2px solid var(--teal); outline-offset: 2px; }
.resultado-inst { display: flex; gap: 16px; align-items: center; margin: 14px 0 6px; }
.resultado-inst:empty { display: none; }
.res-num b { display: block; font: 500 2.2rem/1 var(--f-tit); }
.zona-guia { margin-bottom: 12px; }

/* Actividades */
.temas { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.rejilla-act { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.tarjeta-act { display: flex; flex-direction: column; padding: 18px; background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio); }
.tarjeta-act h3 { margin: 4px 0 6px; font-size: 1.15rem; }
.tarjeta-act > p { font-size: .9rem; color: var(--tinta-2); }
.tarjeta-act .acciones { margin-top: auto; padding-top: 10px; }

/* Cronograma */
.progreso-anual { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.progreso-anual p { margin: 0; }
.barra { flex: 1 1 240px; height: 10px; border-radius: 99px; background: var(--hundido); overflow: hidden; }
.barra span { display: block; height: 100%; background: var(--teal); border-radius: 99px; }
.meses { display: grid; gap: 8px; }
.mes { background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio-chico); }
.mes.actual { border-color: var(--teal); }
.mes summary { display: flex; align-items: baseline; gap: 12px; padding: 13px 16px; cursor: pointer; list-style: none; flex-wrap: wrap; }
.mes summary::-webkit-details-marker { display: none; }
.mes-nom { font: 500 1.1rem/1.2 var(--f-tit); min-width: 100px; }
.mes-foco { flex: 1; font-size: .86rem; color: var(--tinta-2); }
.mes-cuenta { font-size: .8rem; color: var(--tinta-3); }
.mes[open] summary { border-bottom: 1px solid var(--linea); }
.mes ul { list-style: none; margin: 0; padding: 6px 16px; }
.mes li { padding: 8px 0; border-top: 1px solid var(--linea); }

// Almacenamiento local: registros en localStorage y fotos en IndexedDB.
const CLAVE = 'brujula-orientacion.v1';

const DB = {
  estudiantes: [], casos: [], actas: [], cartas: [], bitacora: [], agenda: [], piar: [],
  cronoHecho: {},
  ajustes: { institucion: '', dane: '', municipio: '', sede: '', orientadora: '', cargo: 'Docente orientador(a)', rector: '', logo: '', encabezado: 'institucion', ultimoRespaldo: '' }
};
const COLECCIONES = ['estudiantes', 'casos', 'actas', 'cartas', 'bitacora', 'agenda', 'piar'];

function cargar() {
  try {
    const raw = localStorage.getItem(CLAVE);
    if (!raw) return;
    const d = JSON.parse(raw);
    COLECCIONES.forEach(c => { if (Array.isArray(d[c])) DB[c] = d[c]; });
    if (d.cronoHecho) DB.cronoHecho = d.cronoHecho;
    if (d.ajustes) Object.assign(DB.ajustes, d.ajustes);
  } catch (e) { console.warn('No se pudieron leer los datos', e); }
}

function guardar() {
  try { localStorage.setItem(CLAVE, JSON.stringify(DB)); return true; }
  catch (e) { aviso('No se pudo guardar. El almacenamiento del navegador puede estar lleno: descarga una copia de seguridad.', 'error'); return false; }
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const porId = (col, id) => DB[col].find(x => x.id === id);

function upsert(col, obj) {
  if (!obj.id) { obj.id = uid(); obj.creado = new Date().toISOString(); DB[col].push(obj); }
  else {
    const i = DB[col].findIndex(x => x.id === obj.id);
    if (i >= 0) DB[col][i] = obj; else DB[col].push(obj);
  }
  obj.actualizado = new Date().toISOString();
  guardar();
  return obj;
}

function quitar(col, id) {
  const reg = porId(col, id);
  (reg && reg.fotos || []).forEach(f => Fotos.borrar(f.id));
  DB[col] = DB[col].filter(x => x.id !== id);
  guardar();
}

const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
function isoLocal(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const hoyISO = () => isoLocal(new Date());
function aFecha(iso) { if (!iso) return null; const [a, m, d] = iso.split('-').map(Number); return new Date(a, m - 1, d); }
function fLarga(iso) { const d = aFecha(iso); return d ? d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear() : ''; }
function fCorta(iso) { const d = aFecha(iso); return d ? String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear() : ''; }
function edad(iso) {
  const n = aFecha(iso); if (!n) return '';
  const h = new Date(); let e = h.getFullYear() - n.getFullYear();
  if (h.getMonth() < n.getMonth() || (h.getMonth() === n.getMonth() && h.getDate() < n.getDate())) e--;
  return e;
}

// ── Fotos en IndexedDB (con respaldo en memoria si el navegador no lo permite)
const Fotos = {
  db: null, memoria: new Map(),
  abrir() {
    if (this.db || !window.indexedDB) return Promise.resolve(this.db);
    return new Promise(res => {
      try {
        const r = indexedDB.open('brujula-fotos', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('fotos');
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  },
  async poner(id, data) {
    const db = await this.abrir();
    if (!db) { this.memoria.set(id, data); return; }
    return new Promise(res => { const t = db.transaction('fotos', 'readwrite'); t.objectStore('fotos').put(data, id); t.oncomplete = res; t.onerror = res; });
  },
  async obtener(id) {
    const db = await this.abrir();
    if (!db) return this.memoria.get(id) || '';
    return new Promise(res => { const r = db.transaction('fotos').objectStore('fotos').get(id); r.onsuccess = () => res(r.result || ''); r.onerror = () => res(''); });
  },
  async borrar(id) {
    const db = await this.abrir();
    if (!db) { this.memoria.delete(id); return; }
    db.transaction('fotos', 'readwrite').objectStore('fotos').delete(id);
  },
  async todas() {
    const db = await this.abrir();
    if (!db) return Object.fromEntries(this.memoria);
    return new Promise(res => {
      const out = {}; const r = db.transaction('fotos').objectStore('fotos').openCursor();
      r.onsuccess = () => { const c = r.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); };
      r.onerror = () => res(out);
    });
  },
  async vaciar() {
    const db = await this.abrir();
    this.memoria.clear();
    if (db) return new Promise(res => { const t = db.transaction('fotos', 'readwrite'); t.objectStore('fotos').clear(); t.oncomplete = res; });
  }
};

// Reduce la foto para no llenar el almacenamiento.
function comprimir(file, max = 1280, calidad = 0.72) {
  return new Promise((res, rej) => {
    const lector = new FileReader();
    lector.onerror = rej;
    lector.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', calidad));
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(file);
  });
}

async function importarRespaldo(texto) {
  const d = JSON.parse(texto);
  if (d.app !== 'brujula-orientacion' || !d.db) throw new Error('El archivo no es un respaldo de esta aplicación.');
  COLECCIONES.forEach(c => { DB[c] = Array.isArray(d.db[c]) ? d.db[c] : []; });
  DB.cronoHecho = d.db.cronoHecho || {};
  Object.assign(DB.ajustes, d.db.ajustes || {});
  await Fotos.vaciar();
  for (const [id, data] of Object.entries(d.fotos || {})) await Fotos.poner(id, data);
  guardar();
}

function descargarArchivo(nombre, contenido, tipo) {
  const blob = contenido instanceof Blob ? contenido : new Blob([contenido], { type: tipo });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

  const celda = v => { const s = v == null ? '' : String(v); return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return '﻿' + filas.map(f => f.map(celda).join(';')).join('\r\n');
}

// ── Delegación de eventos: elementos con data-act="nombre" llaman a mapa[nombre](id, elemento, evento)
function enlazar(root, mapa) {
  root.onclick = e => {
    const b = e.target.closest('[data-act]');
    if (!b || !root.contains(b) || !mapa[b.dataset.act]) return;
    if (b.tagName === 'A') e.preventDefault();
    mapa[b.dataset.act](b.dataset.id, b, e);
  };
}

    b.onclick = async () => {
      if (!a.fn) { d.close(); return; }
      b.disabled = true;
      try { const r = await a.fn(cuerpoEl, d); if (r !== false) { guardado = true; d.close(); } }
      finally { b.disabled = false; }
    };
    pie.appendChild(b);
  });
  $('[data-cerrar]', d).onclick = () => d.close();
  d.addEventListener('close', () => { if (alCerrar) alCerrar(guardado); d.remove(); });
  d.addEventListener('cancel', e => { if (d.dataset.sucio) { e.preventDefault(); confirmar('¿Cerrar sin guardar?').then(ok => ok && d.close()); } });
  cuerpoEl.addEventListener('input', () => { d.dataset.sucio = '1'; }, { once: true });
  document.body.appendChild(d);
  d.showModal();
  const primero = $('input:not([type=hidden]):not([type=checkbox]):not([type=radio]), textarea, select', cuerpoEl);
  if (primero && window.matchMedia('(pointer: fine)').matches) primero.focus();
  return { d, cuerpo: cuerpoEl };
}

function confirmar(msg, txtSi = 'Sí, continuar') {

      acciones: [{ txt: 'Cancelar', cls: 'sec' }, { txt: txtSi, cls: 'peligro', fn: () => { r = true; } }],
      alCerrar: () => res(r) });

}

function opciones(o) { return (o || []).map(x => Array.isArray(x) ? x : [x, x]); }

function campoHTML(c, v) {
  const id = 'f-' + c.k;
  const req = c.req ? ' required' : '';
  const ph = c.ph ? ' placeholder="' + esc(c.ph) + '"' : '';
  const hint = c.hint ? '<small>' + esc(c.hint) + '</small>' : '';
  const cls = 'campo' + (c.full ? ' full' : '') + (c.tipo === 'textarea' ? ' full' : '');
  if (v == null) v = c.def != null ? c.def : '';
  let input;
  switch (c.tipo) {
    case 'textarea':
      input = '<textarea id="' + id + '" name="' + c.k + '" rows="' + (c.filas || 3) + '"' + ph + req + '>' + esc(v) + '</textarea>'; break;
    case 'select':
    case 'estudiante':
    case 'caso': {
      let ops = c.tipo === 'estudiante' ? [['', 'Selecciona…']].concat(DB.estudiantes.slice().sort(ordenNombre).map(e => [e.id, e.nombre + (e.grado ? ' · ' + e.grado : '')]))
        : c.tipo === 'caso' ? [['', 'Sin caso relacionado']].concat(DB.casos.map(x => [x.id, nombreCaso(x)]))
        : opciones(c.ops);
      input = '<select id="' + id + '" name="' + c.k + '"' + req + '>' + ops.map(([val, lab]) => '<option value="' + esc(val) + '"' + (String(val) === String(v) ? ' selected' : '') + '>' + esc(lab) + '</option>').join('') + '</select>';
      break;
    }
    case 'checks': {
      const sel = Array.isArray(v) ? v : [];
      return '<fieldset class="campo full"><legend>' + esc(c.label) + '</legend><div class="chips">' +
        opciones(c.ops).map(([val, lab]) => '<label class="chip"><input type="checkbox" name="' + c.k + '" value="' + esc(val) + '"' + (sel.includes(val) ? ' checked' : '') + '><span>' + esc(lab) + '</span></label>').join('') +
        '</div>' + hint + '</fieldset>';
    }
    case 'check':
      return '<label class="campo-check' + (c.full ? ' full' : '') + '"><input type="checkbox" name="' + c.k + '"' + (v ? ' checked' : '') + '><span>' + esc(c.label) + '</span></label>';
    default:
      input = '<input id="' + id + '" name="' + c.k + '" type="' + (c.tipo || 'text') + '" value="' + esc(v) + '"' + ph + req + '>';
  }
  return '<label class="' + cls + '" for="' + id + '"><span>' + esc(c.label) + (c.req ? ' <b class="req">*</b>' : '') + '</span>' + input + hint + '</label>';
}

function formHTML(campos, datos = {}) {
  return '<div class="campos">' + campos.map(c => c.seccion ? '<h3 class="seccion-form full">' + esc(c.seccion) + '</h3>' : campoHTML(c, datos[c.k])).join('') + '</div>';
}

function leerForm(root, campos, base = {}) {
  const o = Object.assign({}, base);
  campos.forEach(c => {
    if (!c.k) return;
    if (c.tipo === 'checks') o[c.k] = $$('input[name="' + c.k + '"]:checked', root).map(i => i.value);
    else if (c.tipo === 'check') { const i = $('input[name="' + c.k + '"]', root); o[c.k] = !!(i && i.checked); }
    else { const i = $('[name="' + c.k + '"]', root); if (i) o[c.k] = i.value.trim(); }
  });
  return o;
}

function validar(root, campos) {
  for (const c of campos) {
    if (!c.req) continue;
    const i = $('[name="' + c.k + '"]', root);
    if (i && !i.value.trim()) { i.focus(); aviso('Completa el campo «' + c.label + '».', 'error'); return false; }
  }
  return true;
}

// ── Fotos: widget de carga con categorías
function montarFotos(cont, fotos, categorias) {
  const estado = { lista: (fotos || []).map(f => Object.assign({}, f)), nuevos: [], quitados: [] };
  const pinta = () => {
    cont.innerHTML = categorias.map(([cat, lab]) => {
      const items = estado.lista.filter(f => f.categoria === cat);
      return '<div class="fotos-grupo"><div class="fotos-cab"><b>' + esc(lab) + '</b><span>' + items.length + '</span></div><div class="fotos-rejilla">' +
        items.map(f => '<figure class="miniatura" data-fid="' + f.id + '"><img alt="" data-src="' + f.id + '"><button type="button" class="quitar" data-quitar="' + f.id + '" aria-label="Quitar foto">' + ic('cerrar') + '</button></figure>').join('') +
        '<label class="subir-foto">' + ic('foto') + '<span>Agregar</span><input type="file" accept="image/*" multiple data-cat="' + cat + '" hidden></label></div></div>';
    }).join('') + '<p class="nota">Las fotos se guardan reducidas en este navegador. Tómalas desde el celular o súbelas desde el computador.</p>';
    $$('img[data-src]', cont).forEach(async img => { img.src = await Fotos.obtener(img.dataset.src); });
  };
  cont.addEventListener('change', async e => {
    const inp = e.target.closest('input[type=file]');
    if (!inp) return;
    for (const file of inp.files) {
      try {
        const data = await comprimir(file);
        const id = 'f' + uid();
        await Fotos.poner(id, data);
        estado.lista.push({ id, categoria: inp.dataset.cat });
        estado.nuevos.push(id);
      } catch (err) { aviso('No se pudo leer una de las imágenes.', 'error'); }
    }
    pinta();
  });
  cont.addEventListener('click', e => {
    const b = e.target.closest('[data-quitar]');
    if (!b) return;
    estado.quitados.push(b.dataset.quitar);
    estado.lista = estado.lista.filter(f => f.id !== b.dataset.quitar);
    pinta();
  });
  pinta();
  return {
    valor: () => estado.lista,
    confirmar: () => estado.quitados.forEach(id => Fotos.borrar(id)),
    cancelar: () => estado.nuevos.forEach(id => Fotos.borrar(id))
  };
}

async function fotosDe(lista) {
  const out = [];
  for (const f of lista || []) { const src = await Fotos.obtener(f.id); if (src) out.push(Object.assign({ src }, f)); }
  return out;
}

// ── Visor de documentos: vista previa editable, imprimir/PDF, Word y copiar
async function abrirDocumento(titulo, htmlOPromesa, nombreArchivo) {
  const v = document.createElement('dialog');
  v.className = 'visor';
  v.innerHTML = '<div class="visor-barra"><button class="icono" data-cerrar aria-label="Cerrar">' + ic('atras') + '</button><div class="visor-tit"><b>' + esc(titulo) + '</b><small>Puedes hacer clic en el texto para corregirlo antes de imprimir.</small></div>' +
    '<div class="visor-acc"><button class="btn sec" data-copiar>' + ic('copiar') + '<span>Copiar texto</span></button><button class="btn sec" data-word>' + ic('descargar') + '<span>Word</span></button><button class="btn" data-imprimir>' + ic('imprimir') + '<span>Imprimir o PDF</span></button></div></div>' +
    '<div class="visor-hoja"><p class="cargando">Preparando documento…</p></div>';
  document.body.appendChild(v);
  v.showModal();
  v.addEventListener('close', () => v.remove());
  $('[data-cerrar]', v).onclick = () => v.close();
  const html = await htmlOPromesa;
  const marco = document.createElement('iframe');
  marco.title = titulo;
  $('.visor-hoja', v).innerHTML = '';
  $('.visor-hoja', v).appendChild(marco);
  marco.srcdoc = html;
  marco.onload = () => {
    const doc = marco.contentDocument;
    doc.body.contentEditable = 'true';
    doc.body.spellcheck = true;
    const ajustar = () => { marco.style.height = (doc.documentElement.scrollHeight + 40) + 'px'; };
    ajustar(); setTimeout(ajustar, 300);
    doc.body.addEventListener('input', ajustar);
  };
  const actual = () => '<!doctype html>' + marco.contentDocument.documentElement.outerHTML.replace(' contenteditable="true"', '');
  const archivo = (nombreArchivo || titulo).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w-]+/g, '-').replace(/-+/g, '-').toLowerCase();
  $('[data-imprimir]', v).onclick = () => { marco.contentWindow.focus(); marco.contentWindow.print(); };
  $('[data-word]', v).onclick = () => {
    const h = actual().replace('<html', '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"');
    descargarArchivo(archivo + '.doc', '﻿' + h, 'application/msword');
    aviso('Documento descargado. Si las fotos no aparecen en Word, usa «Imprimir o PDF».');
  };
  $('[data-copiar]', v).onclick = async () => {
    try { await navigator.clipboard.writeText(marco.contentDocument.body.innerText); aviso('Texto copiado.'); }
    catch (e) { aviso('No se pudo copiar el texto.', 'error'); }
  };
}

    '<a class="modalidad-card" href="#/nuevo-caso/orientacion' + sufijo + '"><span class="mc-ic">' + ic('brujula') + '</span><h2>Orientación escolar</h2>' +
    '<p>Atención individual por remisión o demanda espontánea: motivo, valoración, instrumentos, plan de acompañamiento y seguimiento.</p>' +
    '<ul><li>Ficha de acompañamiento</li><li>Seguimientos con fechas</li><li>Citaciones, consentimiento y remisión a salud</li></ul><span class="mc-ir">Registrar ' + ic('flecha') + '</span></a>' +
    '<a class="modalidad-card ruta" href="#/nuevo-caso/ruta' + sufijo + '"><span class="mc-ic">' + ic('activar') + '</span><h2>Activación de ruta</h2>' +
    '<p>Situaciones tipo II y III, riesgo suicida, violencia sexual, maltrato, consumo, ciberacoso, embarazo o ausentismo.</p>' +
    '<ul><li>Protocolo paso a paso</li><li>Entidades que deben ser convocadas</li><li>Registro de activación y misivas listas</li></ul><span class="mc-ir">Activar ' + ic('flecha') + '</span></a>' +
    '</div><p class="nota">Si un caso de orientación escolar termina requiriendo la ruta, podrás activarla desde el mismo caso sin volver a escribir los datos.</p>';
};

// Selección de entidades sugeridas para una ruta. `actuales` son las ya guardadas en el caso.
function entidadesHTML(rutaId, actuales) {
  if (!rutaId) return '<p class="nota">Elige el tipo de situación para ver las entidades que deben ser convocadas.</p>';
  const sug = CONVOCAR_POR_RUTA[rutaId] || [];
  const marcadas = actuales ? actuales.map(x => x.key) : (CONVOCAR_DEFECTO[rutaId] || []);
  const otras = Object.keys(ENTIDADES).filter(k => !sug.includes(k));
  const chip = (k, s) => '<label class="chip' + (s ? ' sugerida' : '') + '"><input type="checkbox" name="entidad" value="' + k + '"' + (marcadas.includes(k) ? ' checked' : '') + '><span>' + esc(ENTIDADES[k].nombre) + '</span></label>';
  return '<fieldset class="campo full"><legend>Entidades que deben ser convocadas</legend>' +
    (sug.length ? '<p class="nota">Sugeridas según el protocolo de esta ruta. Las preseleccionadas son las que se convocan en la mayoría de los casos; ajústalas según la situación.</p><div class="chips">' + sug.map(k => chip(k, true)).join('') + '</div>'
      : '<p class="nota">Esta situación se atiende dentro de la institución; normalmente no requiere entidades externas.</p>') +
    '<details' + (otras.some(k => marcadas.includes(k)) ? ' open' : '') + '><summary>Otras entidades</summary><div class="chips">' + otras.map(k => chip(k, false)).join('') + '</div></details></fieldset>';
}

function guiaRutaHTML(rutaId) {
  const r = RUTAS.find(x => x.id === rutaId);
  if (!r) return '';
  return '<div class="guia-ruta nivel-' + r.nivel + '"><b>' + esc(r.titulo) + '</b><p>' + esc(r.cuando) + '</p>' +
    '<p class="gr-tit">Primeros pasos</p><ol>' + r.pasos.slice(0, 3).map(p => '<li><b>' + esc(p.quien) + ':</b> ' + esc(p.que) + '</li>').join('') + '</ol>' +
    (r.noHacer && r.noHacer.length ? '<p class="gr-tit">Evita</p><ul>' + r.noHacer.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '') + '</div>';
}

// Convierte las casillas marcadas en entidades del caso, conservando estado y fechas de las que ya existían.
function leerEntidades(root, actuales) {
  const keys = $$('input[name="entidad"]:checked', root).map(i => i.value);
  const prev = actuales || [];
  return keys.map(k => prev.find(x => x.key === k) || { key: k, estado: 'pendiente', fechaEnvio: '' })
    .concat(prev.filter(x => !ENTIDADES[x.key]));
}

// Conecta el selector de ruta con la guía y las entidades.
function conectarRuta(root, actuales) {
  const sel = $('[name=rutaId]', root);
  const act = () => { $('.zona-guia', root).innerHTML = guiaRutaHTML(sel.value); $('.zona-entidades', root).innerHTML = entidadesHTML(sel.value, sel.value === sel.dataset.inicial ? actuales : null); };
  sel.dataset.inicial = sel.value;
  sel.addEventListener('change', act);
  act();
}

// ── Formulario de caso (nuevo o edición)
function formCaso(el, modalidad, caso, estId) {
  const esRuta = modalidad === 'ruta';
  const datos = caso || { estudianteId: estId || '' };
  const camposA = esRuta ? camposRuta() : camposApertura();
  const camposFicha = esRuta ? [{ k: 'motivo', label: 'Motivo de atención', tipo: 'textarea', filas: 2, hint: 'Si lo dejas vacío se usa el tipo de situación.' }, camposApertura()[4]].concat(CAMPOS_VALORACION) : CAMPOS_VALORACION;
  const todos = camposA.concat(camposFicha);
  const hayEst = DB.estudiantes.length > 0;
  const modoIni = caso || (hayEst && estId) || (hayEst && !estId) ? 'existente' : 'nuevo';
  const titulo = (caso ? 'Editar caso · ' : 'Nuevo caso · ') + (esRuta ? 'Activación de ruta' : 'Orientación escolar');
  el.innerHTML = cabecera(titulo, { volver: caso ? '#/caso/' + caso.id : '#/nuevo-caso' + (estId ? '/x/' + estId : '') }) +
    '<form class="form-caso" novalidate>' +
    panel('1. Estudiante',
      (hayEst && !caso ? '<div class="segmento"><label><input type="radio" name="modoEst" value="existente"' + (modoIni === 'existente' ? ' checked' : '') + '><span>Ya registrado</span></label><label><input type="radio" name="modoEst" value="nuevo"' + (modoIni === 'nuevo' ? ' checked' : '') + '><span>Estudiante nuevo</span></label></div>' : '') +
      '<div data-modo="existente"' + (modoIni === 'existente' ? '' : ' hidden') + '>' + formHTML([{ k: 'estudianteId', label: 'Estudiante', tipo: 'estudiante', full: true }], datos) + '</div>' +
      '<div data-modo="nuevo"' + (modoIni === 'nuevo' ? '' : ' hidden') + '>' + formHTML(CAMPOS_ESTUDIANTE) + '</div>') +
    (esRuta
      ? panel('2. Situación y activación', formHTML(camposA.slice(0, 1), datos) + '<div class="zona-guia"></div>' + formHTML(camposA.slice(1), datos)) +
        panel('3. Entidades', '<div class="zona-entidades"></div>') +
        panel('4. Ficha de acompañamiento', '<p class="nota">Puedes completarla ahora o después, a medida que avance el caso.</p>' + formHTML(camposFicha, datos))
      : panel('2. Apertura', formHTML(camposA, datos)) + panel('3. Valoración y plan', formHTML(camposFicha, datos))) +
    '<div class="barra-guardar">' + boton('cancelar', 'Cancelar', '', 'sec') + boton('guardar', caso ? 'Guardar cambios' : 'Registrar caso', 'check') + '</div></form>';
  const form = $('.form-caso', el);
  if (esRuta) conectarRuta(form, caso && caso.entidades);
  form.addEventListener('change', e => {
    if (e.target.name !== 'modoEst') return;
    $$('[data-modo]', form).forEach(d => { d.hidden = d.dataset.modo !== e.target.value; });
  });
  form.addEventListener('submit', e => e.preventDefault());
  enlazar(el, {
    cancelar: () => history.back(),
    guardar: () => {
      const modo = (($('input[name=modoEst]:checked', form) || {}).value) || (hayEst || caso ? 'existente' : 'nuevo');
      if (modo === 'nuevo' && !validar(form, CAMPOS_ESTUDIANTE)) return;
      if (modo === 'existente' && !$('[name=estudianteId]', form).value) { aviso('Selecciona el estudiante.', 'error'); return; }
      if (!validar(form, todos)) return;
      const c = leerForm(form, todos, caso || { modalidad, seguimientos: [], instrumentos: [], protocolo: [], entidades: [] });
      if (modo === 'nuevo') c.estudianteId = upsert('estudiantes', leerForm($('[data-modo=nuevo]', form), CAMPOS_ESTUDIANTE)).id;
      else c.estudianteId = $('[name=estudianteId]', form).value;
      if (esRuta) {
        c.entidades = leerEntidades(form, caso && caso.entidades);
        if (!c.motivo) c.motivo = (rutaDe(c) || {}).titulo || '';
        if (caso && caso.rutaId !== c.rutaId) c.protocolo = [];
      }
      upsert('casos', c);
      aviso(caso ? 'Cambios guardados.' : 'Caso registrado.');
      location.hash = '#/caso/' + c.id;
    }
  });
}

function borrarCaso(id) {
  DB.actas.forEach(a => { if (a.casoId === id) a.casoId = ''; });
  DB.cartas.forEach(a => { if (a.casoId === id) a.casoId = ''; });
  quitar('casos', id);
}

// ── Seguimiento

];

// ── Instrumentos: aplicar en la aplicación o registrar un resultado externo
function calcularInstrumento(inst, resp) {
  const vals = inst.escala.map(o => o[1]); const min = Math.min(...vals), max = Math.max(...vals);
  const r = resp.map((x, i) => x == null ? null : (inst.invertidos || []).includes(i) ? min + max - x : x);
  const total = r.reduce((a, x) => a + (x || 0), 0);
  return { total, completo: resp.filter(x => x != null).length === inst.items.length, interpretacion: inst.interpretar(total, resp), nivel: inst.nivel(total, resp), alerta: inst.alerta ? inst.alerta(resp, total) : '' };
}

function aplicarInstrumento(c, alGuardar, instIdInicial) {
  const opsInst = INSTRUMENTOS.map(i => '<option value="' + i.id + '">' + esc(i.nombre + ' · ' + i.titulo) + '</option>').join('');
  const cuerpo = document.createElement('div');
  cuerpo.innerHTML = '<div class="campos"><label class="campo full"><span>Instrumento</span><select name="instId">' + opsInst + '<option value="otro">Otro instrumento (registrar el resultado)</option></select></label>' +
    '<label class="campo"><span>Fecha de aplicación</span><input type="date" name="fechaInst" value="' + hoyISO() + '"></label></div><div class="zona-inst"></div>';
  let resp = [];
  const sel = $('[name=instId]', cuerpo);
  if (instIdInicial) sel.value = instIdInicial;
  const resumen = () => {
    const inst = INSTRUMENTOS.find(i => i.id === sel.value); if (!inst) return;
    const r = calcularInstrumento(inst, resp);
    $('.resultado-inst', cuerpo).innerHTML = '<div class="res-num">' + (inst.sinTotal ? '' : '<b>' + r.total + '</b><small>puntos</small>') + '</div><div><span class="nivel-inst n' + r.nivel + '">' + esc(r.interpretacion) + '</span>' +
      (r.completo ? '' : '<small>Faltan ' + (inst.items.length - resp.filter(x => x != null).length) + ' respuestas</small>') + '</div>' +
      (r.alerta ? '<p class="alerta-inst">' + ic('alerta') + esc(r.alerta) + '</p>' : '');
  };
  const pinta = () => {
    const inst = INSTRUMENTOS.find(i => i.id === sel.value);
    resp = [];
    if (!inst) {
      $('.zona-inst', cuerpo).innerHTML = formHTML([
        { k: 'nombreOtro', label: 'Nombre del instrumento', req: true, full: true, ph: 'Ej.: ' + INSTRUMENTOS_REFERENCIA.slice(0, 2).map(x => x.nombre).join(', ') },
        { k: 'puntajeOtro', label: 'Puntaje o resultado' },
        { k: 'interpOtro', label: 'Interpretación', tipo: 'textarea', filas: 3 }
      ]) + '<datalist id="lista-ref">' + INSTRUMENTOS_REFERENCIA.map(x => '<option value="' + esc(x.nombre) + '">').join('') + '</datalist>';
      $('[name=nombreOtro]', cuerpo).setAttribute('list', 'lista-ref');
      return;
    }
    $('.zona-inst', cuerpo).innerHTML = '<div class="info-inst"><span>' + esc(inst.edad) + '</span><span>' + ic('reloj') + esc(inst.tiempo) + '</span></div><p class="consigna">' + esc(inst.consigna) + '</p>' +
      '<ol class="items-inst">' + inst.items.map((it, i) => '<li><p>' + esc(it) + '</p><div class="escala">' + inst.escala.map(o => '<label><input type="radio" name="it' + i + '" value="' + o[1] + '"><span>' + esc(o[0]) + '</span></label>').join('') + '</div></li>').join('') + '</ol>' +
      '<div class="resultado-inst"></div><p class="nota">' + esc(inst.nota) + ' Es un tamizaje: orienta la remisión, no diagnostica.</p>';
    resumen();
  };
  cuerpo.addEventListener('change', e => {
    if (e.target === sel) return pinta();
    const m = /^it(\d+)$/.exec(e.target.name || '');
    if (m) { resp[+m[1]] = Number(e.target.value); resumen(); }
  });
  sel.onchange = pinta;
  pinta();
  abrirModal({ titulo: 'Aplicar instrumento', cuerpo, ancho: 'ancho', acciones: [
    { txt: 'Cancelar', cls: 'sec' },
    { txt: 'Guardar resultado', icono: 'check', fn: root => {
      const fecha = $('[name=fechaInst]', root).value || hoyISO();
      const inst = INSTRUMENTOS.find(i => i.id === sel.value);
      let reg;
      if (inst) {
        const r = calcularInstrumento(inst, resp);
        if (!r.completo && !confirm('Hay preguntas sin responder. ¿Guardar de todos modos?')) return false;
        reg = { id: uid(), instId: inst.id, nombre: inst.nombre, fecha, puntaje: inst.sinTotal ? '' : String(r.total), interpretacion: r.interpretacion, nivel: r.nivel, alerta: r.alerta, respuestas: inst.items.map((x, i) => resp[i] == null ? null : resp[i]) };
      } else {
        const nombre = $('[name=nombreOtro]', root).value.trim();
        if (!nombre) { aviso('Escribe el nombre del instrumento.', 'error'); return false; }
        reg = { id: uid(), instId: '', nombre, fecha, puntaje: $('[name=puntajeOtro]', root).value.trim(), interpretacion: $('[name=interpOtro]', root).value.trim() };
      }
      c.instrumentos = (c.instrumentos || []).concat(reg);
      upsert('casos', c);
      aviso(reg.alerta ? 'Resultado guardado. Revisa la alerta del instrumento.' : 'Resultado guardado.', reg.alerta ? 'error' : 'ok');
      alGuardar();
    } }
  ] });
}

// ── Activar ruta desde un caso de orientación escolar
function activarRuta(c, alGuardar) {
  const campos = camposActivacion();
  const cuerpo = '<p class="nota">El caso conserva su ficha y sus seguimientos. Se agregará el registro de activación, el protocolo y las entidades.</p>' +
    formHTML(campos.slice(0, 1), {}) + '<div class="zona-guia"></div>' + formHTML(campos.slice(1), { fechaActivacion: hoyISO() }) + '<div class="zona-entidades"></div>';
  const { cuerpo: root } = abrirModal({ titulo: 'Activar ruta de atención', cuerpo, ancho: 'ancho', acciones: [
    { txt: 'Cancelar', cls: 'sec' },
    { txt: 'Activar ruta', icono: 'activar', cls: 'alerta', fn: r => {
      if (!validar(r, campos)) return false;
      const d = leerForm(r, campos);
      const ruta = RUTAS.find(x => x.id === d.rutaId);
      Object.assign(c, { modalidad: 'ruta', rutaId: d.rutaId, fechaHechos: d.fechaHechos, lugar: d.lugar, hechos: d.hechos, accionesInmediatas: d.accionesInmediatas, familiaNotificada: d.familiaNotificada, fechaActivacion: d.fechaActivacion, protocolo: [] });
      if (d.remitidoPor && !c.remitidoPor) c.remitidoPor = d.remitidoPor;
      c.entidades = leerEntidades(r, c.entidades);
      c.seguimientos = (c.seguimientos || []).concat({ id: uid(), fecha: d.fechaActivacion || hoyISO(), tipo: 'Activación de ruta', descripcion: 'Se activa la ruta: ' + ruta.titulo + '. ' + d.hechos, acuerdos: d.accionesInmediatas, proximaFecha: '' });
      if (c.estado === 'cerrado') c.estado = 'seguimiento';
      upsert('casos', c); aviso('Ruta activada.'); alGuardar();
    } }
  ] });
  conectarRuta(root, null);
}

// ── Expediente: todos los documentos del caso en un solo archivo
function interiorDoc(html) {
  const i = html.indexOf('<div class="hoja">'), f = html.lastIndexOf('</div></body>');
  return i < 0 ? '' : html.slice(i + 18, f).replace(/<div class="enc[^"]*"><\/div>|<table class="enc">[\s\S]*?<\/table>/, '');
}
function docExpediente(c) {
  const e = porId('estudiantes', c.estudianteId) || {};
  const partes = [docFicha(c)];
  if (c.modalidad === 'ruta') partes.push(docRegistroRuta(c));
  (c.entidades || []).forEach(x => partes.push(docMisiva(c, x)));
  DB.actas.filter(a => a.casoId === c.id).sort((a, b) => (a.fecha || '').localeCompare(b.fecha || '')).forEach(a => partes.push(docActa(a)));
  DB.cartas.filter(a => a.casoId === c.id).forEach(a => partes.push(docCarta(a)));
  const ins = (c.instrumentos || []).filter(r => r.instId);
  ins.forEach(r => { const inst = INSTRUMENTOS.find(i => i.id === r.instId); if (inst) partes.push(docInstrumento(inst, r, e)); });
  const cuerpo = partes.map((h, i) => (i ? '<div class="salto"></div>' : '') + interiorDoc(h).replace(/<p class="pie">[\s\S]*?<\/p>$/, '')).join('');
  return docBase('Expediente de orientación escolar', cuerpo.replace(/^<h1>[^<]*<\/h1><p class="sub">[^<]*<\/p>/, ''), { sub: esc(e.nombre || '') + ' · ' + esc(etiquetaModalidad(c)) });
}

function documentosCaso(c) {
  const e = porId('estudiantes', c.estudianteId) || {};
  const base = (e.nombre || 'estudiante');
  const lista = [['Ficha de acompañamiento', () => docFicha(c), 'ficha-' + base]];
  if (c.modalidad === 'ruta') lista.push(['Registro de activación de ruta', () => docRegistroRuta(c), 'activacion-ruta-' + base]);
  (c.entidades || []).forEach(x => lista.push(['Misiva a ' + entidadInfo(x).nombre, () => docMisiva(c, x), 'misiva-' + entidadInfo(x).nombre + '-' + base]));
  lista.push(['Citación a acudiente', () => docCitacion(c), 'citacion-' + base],
    ['Remisión a servicios de salud', () => docRemisionSalud(c), 'remision-salud-' + base],
    ['Consentimiento informado', () => docConsentimiento(c), 'consentimiento-' + base],
    ['Expediente completo del caso', () => docExpediente(c), 'expediente-' + base]);
  return lista;
}

    const seg = (c.seguimientos || []).slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
    const actas = DB.actas.filter(a => a.casoId === c.id);
    const cartas = DB.cartas.filter(a => a.casoId === c.id);
    const prot = c.protocolo || [];

    const situacion = datosDL([['Apertura', fLarga(c.fechaApertura)], ['Remitido por', c.remitidoPor], ['Activación de ruta', c.fechaActivacion ? fLarga(c.fechaActivacion) : ''],
      ['Fecha de los hechos', c.fechaHechos ? fLarga(c.fechaHechos) : ''], ['Lugar', c.lugar]]) +

      bloqueTexto('Acciones inmediatas', c.accionesInmediatas) + bloqueTexto('Notificación a la familia', c.familiaNotificada) +
      bloqueTexto('Antecedentes', c.antecedentes) + bloqueTexto('Áreas exploradas', c.areas) + bloqueTexto('Valoración', c.valoracion) +

      if (!await confirmar('Se borrará el caso con sus seguimientos e instrumentos. Las actas y cartas quedan guardadas, sin caso asociado.', 'Borrar caso')) return;
      borrarCaso(c.id); aviso('Caso borrado.'); location.hash = '#/casos';

    const t = e.target;
    if (t.dataset.paso != null) {
      const i = +t.dataset.paso; c.protocolo = c.protocolo || [];
      c.protocolo[i] = { hecho: t.checked, fecha: t.checked ? ((c.protocolo[i] || {}).fecha || hoyISO()) : '' };
      guardarYPintar();
    } else if (t.dataset.pasoFecha != null) {

// Todas las bitácoras de un periodo en un solo documento.
async function docBitacorasConsolidado(lista, anio) {
  const partes = [];
  for (const b of lista) partes.push(interiorDoc(await docBitacora(b)));
  const resumen = tabla([{ t: 'Fecha', w: '12%' }, 'Actividad', { t: 'Tipo', w: '20%' }, { t: 'Población', w: '20%' }, { t: 'Part.', w: '8%' }],
    lista.map(b => [fCorta(b.fecha), b.titulo, b.tipo, b.poblacion, String(b.numAsistentes || lineas(b.asistentes).length || '')]));
  return docBase('Consolidado de actividades' + (anio ? ' ' + anio : ''), '<p>Total de actividades: <b>' + lista.length + '</b>.</p>' + resumen + partes.map(p => '<div class="salto"></div>' + p).join(''), { confidencial: false });
}

// Informe de gestión: consolida todo lo registrado en un año o en un rango de fechas.
const contar = (lista, clave) => lista.reduce((m, x) => { const k = (typeof clave === 'function' ? clave(x) : x[clave]) || 'Sin dato'; m[k] = (m[k] || 0) + 1; return m; }, {});
const ordenarConteo = o => Object.entries(o).sort((a, b) => b[1] - a[1]);

function datosInforme(desde, hasta) {
  const r = iso => enRango(iso, desde, hasta);
  const casos = DB.casos.filter(c => r(c.fechaApertura));
  const seguimientos = DB.casos.flatMap(c => (c.seguimientos || []).filter(s => r(s.fecha)).map(s => Object.assign({ caso: c }, s)));
  const instrumentos = DB.casos.flatMap(c => (c.instrumentos || []).filter(i => r(i.fecha)).map(i => Object.assign({ caso: c }, i)));
  const entidades = DB.casos.flatMap(c => (c.entidades || []).filter(x => r(x.fechaEnvio) || (!x.fechaEnvio && r(c.fechaActivacion || c.fechaApertura))).map(x => Object.assign({ caso: c }, x)));
  const bitacora = DB.bitacora.filter(b => r(b.fecha)).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const agenda = DB.agenda.filter(t => r(t.fecha));
  const actas = DB.actas.filter(a => r(a.fecha));
  const cartas = DB.cartas.filter(k => r(k.fecha));
  const revisiones = DB.piar.flatMap(p => (p.revisiones || []).filter(x => r(x.fecha)));
  const piar = DB.piar.filter(p => r(p.fecha) || (p.revisiones || []).some(x => r(x.fecha)));
  const estudiantes = new Set(casos.map(c => c.estudianteId).concat(seguimientos.map(s => s.caso.estudianteId)));
  const participantes = bitacora.reduce((s, b) => s + (Number(b.numAsistentes) || 0), 0);
  return { desde, hasta, casos, seguimientos, instrumentos, entidades, bitacora, agenda, actas, cartas, piar, revisiones, estudiantes, participantes };
}

// Actividad registrada por cada área de gestión (funciones del docente orientador).
function porArea(d) {
  return AREAS_GESTION.map((a, i) => {
    const bit = d.bitacora.filter(b => b.area === a), tar = d.agenda.filter(t => t.categoria === a);
    const extra = [];
    if (i === 2) extra.push(d.casos.filter(c => c.modalidad !== 'ruta').length + ' casos de orientación', d.seguimientos.length + ' seguimientos');
    if (i === 3) extra.push(d.casos.filter(c => c.modalidad === 'ruta').length + ' rutas activadas', d.entidades.length + ' entidades convocadas', d.cartas.length + ' cartas de articulación');
    if (i === 4) extra.push(d.actas.filter(x => x.tipo === 'padres').length + ' reuniones con familias');
    if (i === 6) extra.push(d.piar.length + ' PIAR', d.revisiones.length + ' revisiones');
    return { area: a, bitacoras: bit.length, tareas: tar.length, hechas: tar.filter(t => t.hecho).length, participantes: bit.reduce((s, b) => s + (Number(b.numAsistentes) || 0), 0), extra: extra.filter(x => !/^0 /.test(x)) };
  });
}

function pintarMenu() {
  $('#menu').innerHTML = MENU.map(([g, items]) => '<p class="menu-grupo">' + esc(g) + '</p>' + items.map(([id, txt, icono]) => '<a href="#/' + id + '" data-sec="' + id + '">' + ic(icono) + '<span>' + esc(txt) + '</span></a>').join('')).join('') +

function rutaActual() {
  const partes = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  return { nombre: partes[0] || 'inicio', args: partes.slice(1) };
}

function navegar(conservarScroll) {
  const { nombre, args } = rutaActual();
  const el = $('#vista');
  const vista = VISTAS[nombre];
  const y = window.scrollY;
  el.onclick = null; el.onchange = null; el.oninput = null;
  // Reemplazar el nodo descarta los listeners agregados con addEventListener por la vista anterior.
  const nuevo = el.cloneNode(false); el.replaceWith(nuevo);
  if (vista) vista(args, nuevo); else noEncontrado(nuevo);
  const sec = SECCION_DE[nombre] || nombre;
  $$('#menu a').forEach(a => a.classList.toggle('activo', a.dataset.sec === sec));
  document.body.classList.remove('menu-abierto');
  const h1 = $('h1', nuevo);
  document.title = (h1 && nombre !== 'inicio' ? h1.textContent + ' · ' : '') + 'Orientación APP';
  window.scrollTo(0, conservarScroll ? y : 0);
}
function refrescar() { navegar(true); }
